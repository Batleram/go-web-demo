# You will also need to enable the following modules

sudo ln -s ../proxy.conf /etc/apache2/mods-enabled
sudo ln -s ../proxy.load /etc/apache2/mods-enabled
sudo ln -s ../proxy_http.load /etc/apache2/mods-enabled

<VirtualHost *:80>
    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:1919/
    ProxyPassReverse / http://127.0.0.1:1919/
</virtualhost>

